<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon-small.png" />
    <title>VCheque Studio — Impression & Calibrage de Chèques</title>
    <style>
      /* Splash statique instantané ultra-épuré (Minimaliste, 0 rectangle, 0 glow) */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #12120e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .pre-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #12120e;
        z-index: 999999;
      }
      .pre-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 480px;
        width: 90%;
      }
      .pre-logos {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        margin-bottom: 24px;
      }
      .pre-img {
        width: 68px;
        height: 68px;
        object-fit: contain;
      }
      .pre-v-spin {
        animation: preVSpin 3.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        transform-style: preserve-3d;
      }
      @keyframes preVSpin {
        0% { transform: perspective(600px) rotateY(0deg); }
        50% { transform: perspective(600px) rotateY(180deg); }
        100% { transform: perspective(600px) rotateY(360deg); }
      }
      .pre-title {
        font-size: 28px;
        font-weight: 800;
        color: #FFFFFF;
        margin: 0 0 8px 0;
        letter-spacing: -0.4px;
      }
      .pre-title span {
        color: #AC8946;
      }
      .pre-sub {
        font-size: 11.5px;
        color: #9c9588;
        font-weight: 500;
        margin-bottom: 26px;
        max-width: 360px;
        line-height: 1.45;
      }
      .pre-footer {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #8c8577;
        margin-bottom: 26px;
      }
      .pre-author {
        font-weight: 600;
        color: #cfc8ba;
      }
      .pre-link {
        color: #AC8946;
        text-decoration: none;
        font-weight: 600;
      }
      .pre-progress-track {
        width: 130px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 99px;
        overflow: hidden;
      }
      .pre-progress-bar {
        height: 100%;
        width: 40%;
        background: #AC8946;
        border-radius: 99px;
        animation: prePulse 1.2s ease-in-out infinite alternate;
      }
      @keyframes prePulse {
        0% { width: 25%; transform: translateX(0%); }
        100% { width: 75%; transform: translateX(35%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-splash">
        <div class="pre-card">
          <div class="pre-logos">
            <img src="/icon-splash.png" alt="Logo" class="pre-img" />
            <img src="/logo.png" alt="Virtanis V" class="pre-img pre-v-spin" />
          </div>
          <h1 class="pre-title"><span>V</span>Cheque Studio</h1>
          <div class="pre-sub">Système Professionnel d'Édition & Calibrage de Chèques Algériens</div>
          <div class="pre-footer">
            <span class="pre-author">By Virtanis</span>
            <span>•</span>
            <span class="pre-link">virtanis.net</span>
          </div>
          <div class="pre-progress-track">
            <div class="pre-progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
