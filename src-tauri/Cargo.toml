[package]
name = "cheque-studio"
version = "0.1.0"
description = "Application desktop de préparation et calibrage de chèques"
authors = ["you"]
edition = "2021"

[lib]
name = "cheque_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
